<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Diagram Canvas Grid Outline -->
  <rect x="56" y="56" width="400" height="400" rx="48" fill="#1e293b" stroke="#334155" stroke-width="4"/>

  <!-- Architecture Box (Top Left) -->
  <g filter="url(#shadow)">
    <rect x="96" y="96" width="180" height="130" rx="16" fill="#0f172a" stroke="#3b82f6" stroke-width="4"/>
    <path d="M 96 112 A 16 16 0 0 1 112 96 L 260 96 A 16 16 0 0 1 276 112" fill="none" stroke="#60a5fa" stroke-width="6"/>
    <rect x="120" y="130" width="132" height="24" rx="6" fill="#1e293b"/>
    <rect x="120" y="168" width="80" height="18" rx="4" fill="#3b82f6" fill-opacity="0.4"/>
  </g>

  <!-- Connection Arrow -->
  <path d="M 276 161 L 340 161 L 340 240" fill="none" stroke="#94a3b8" stroke-width="4" stroke-dasharray="8 6"/>
  <polygon points="340,250 332,236 348,236" fill="#94a3b8"/>

  <!-- State / Protected Block (Bottom Right) -->
  <g filter="url(#shadow)">
    <rect x="236" y="250" width="180" height="150" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-width="4"/>
    <rect x="256" y="274" width="140" height="32" rx="8" fill="#f59e0b" fill-opacity="0.2"/>
    <circle cx="280" cy="290" r="6" fill="#f59e0b"/>
    <line x1="298" y1="290" x2="376" y2="290" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Lock shape -->
    <path d="M 314 340 L 314 332 A 12 12 0 0 1 338 332 L 338 340" fill="none" stroke="#f59e0b" stroke-width="4"/>
    <rect x="306" y="340" width="40" height="30" rx="6" fill="url(#amberGrad)"/>
    <circle cx="326" cy="355" r="3" fill="#ffffff"/>
  </g>

  <!-- Vector Pen tool accent (Top Right) -->
  <g transform="translate(360, 80) rotate(45)">
    <path d="M 0 0 L 28 8 L 24 24 L 8 28 Z" fill="#38bdf8"/>
    <path d="M 8 28 L 4 52 L 28 28 Z" fill="#0284c7"/>
    <circle cx="16" cy="16" r="3" fill="#ffffff"/>
  </g>
</svg>
